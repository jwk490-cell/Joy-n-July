<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>핵심 7종목 KOSPI 시총 비중</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--line:#2d333b;--gold:#d4a843;--gold-line:#3a3325;
--txt:#e6e6e6;--dim:#9aa4af;--dim2:#6b737c;--up:#ef5350;--dn:#42a5f5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
font-size:14px;line-height:1.55;padding:26px 20px 60px;max-width:900px;margin:0 auto}
h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:12px;margin-top:5px}
.hero{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
.stat{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:11.5px;color:var(--dim)}
.stat .v{font-size:22px;font-weight:800;margin-top:3px}
.stat .v small{font-size:12px;color:var(--dim);font-weight:600}
.stat.acc{border-color:var(--gold-line)}
.stat.acc .v{color:var(--gold)}
.barwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.barwrap .t{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.seg{height:100%;min-width:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12px;color:var(--dim)}
.legend span i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:right;font-size:13px;border-bottom:1px solid var(--line)}
th{background:#1b212a;color:var(--dim);font-size:11.5px;font-weight:600}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:700}
td.name .cd{color:var(--dim2);font-size:11px;font-weight:400;margin-left:5px}
tr.grp td{background:#1a2029;color:var(--gold);font-weight:700;font-size:12.5px}
tr.total td{background:#20242c;font-weight:800;border-top:2px solid var(--gold-line)}
.flu-up{color:var(--up)}.flu-dn{color:var(--dn)}
.wbar{display:inline-block;height:7px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-right:7px;opacity:.85}
.foot{margin-top:18px;font-size:11px;color:var(--dim2);line-height:1.7}
</style></head><body>
<h1>핵심 7종목 — KOSPI 시가총액 대비 비중</h1>
<div class="sub" id="sub"></div>
<div class="hero" id="hero"></div>
<div class="barwrap"><div class="t">KOSPI 시총에서 차지하는 면적 (나머지 = 회색)</div>
<div class="stack" id="stack"></div><div class="legend" id="legend"></div></div>
<div id="tbl"></div>
<div class="foot">시가총액은 현 시각 현재가 기준(키움 REST ka10001 mac). KOSPI 총시총은 업종 태깅 전 종목(보통주+우선주+리츠, ETF·ETN·스팩·거래정지 제외) 합산 — 거래소 공표치와 소폭 차이 날 수 있음.<br>
재생성: <code>python3 basket7_build.py</code> (수급html 저장소)</div>
<script>
const D = {"as_of": "2026-08-12 12:03", "kospi_total_jo": 5417.3, "n_stocks": 892, "basket_weight": 54.59, "stocks": [{"code": "005930", "name": "삼성전자", "grp": "반도체·SK", "cap_jo": 1509.8, "close": 258250, "flu": 7.83, "weight": 27.87}, {"code": "005935", "name": "삼성전자우", "grp": "반도체·SK", "cap_jo": 150.77, "close": 187900, "flu": 4.27, "weight": 2.783}, {"code": "000660", "name": "SK하이닉스", "grp": "반도체·SK", "cap_jo": 1113.27, "close": 1524000, "flu": 6.95, "weight": 20.55}, {"code": "402340", "name": "SK스퀘어", "grp": "반도체·SK", "cap_jo": 137.1, "close": 1039000, "flu": 9.95, "weight": 2.531}, {"code": "010950", "name": "S-Oil", "grp": "정유", "cap_jo": 16.14, "close": 143400, "flu": 1.27, "weight": 0.298}, {"code": "096770", "name": "SK이노베이션", "grp": "정유", "cap_jo": 21.22, "close": 125500, "flu": 1.13, "weight": 0.392}, {"code": "078930", "name": "GS", "grp": "정유", "cap_jo": 9.22, "close": 99200, "flu": 1.74, "weight": 0.17}]};
const COLORS = {"005930":"#4f8ef7","005935":"#7fa8f5","000660":"#e0644f","402340":"#e59a52","010950":"#4fb477","096770":"#3d8f63","078930":"#6ccf9a"};
const fmt=(n,d=2)=>n==null?'—':n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
document.getElementById('sub').textContent=`기준 ${D.as_of} · KOSPI ${D.n_stocks}종목 합산`;
document.getElementById('hero').innerHTML=`
<div class="stat acc"><div class="k">7종목 합산 비중</div><div class="v">${fmt(D.basket_weight)}<small> %</small></div></div>
<div class="stat"><div class="k">KOSPI 총 시가총액</div><div class="v">${fmt(D.kospi_total_jo,1)}<small> 조원</small></div></div>
<div class="stat"><div class="k">7종목 합산 시총</div><div class="v">${fmt(D.stocks.reduce((a,s)=>a+s.cap_jo,0),1)}<small> 조원</small></div></div>`;
const stack=document.getElementById('stack'),legend=document.getElementById('legend');
let acc=0;
D.stocks.forEach(s=>{acc+=s.weight;
 stack.insertAdjacentHTML('beforeend',`<div class="seg" style="width:${s.weight}%;background:${COLORS[s.code]}" title="${s.name} ${fmt(s.weight)}%"></div>`);
 legend.insertAdjacentHTML('beforeend',`<span><i style="background:${COLORS[s.code]}"></i>${s.name} ${fmt(s.weight)}%</span>`);});
stack.insertAdjacentHTML('beforeend',`<div class="seg" style="width:${100-acc}%;background:#2a2f38" title="기타 ${fmt(100-acc)}%"></div>`);
legend.insertAdjacentHTML('beforeend',`<span><i style="background:#2a2f38"></i>기타 KOSPI ${fmt(100-acc)}%</span>`);
const grps=[...new Set(D.stocks.map(s=>s.grp))];
const maxW=Math.max(...D.stocks.map(s=>s.weight));
let rows='';
grps.forEach(g=>{
 const ss=D.stocks.filter(s=>s.grp===g);
 const gw=ss.reduce((a,s)=>a+s.weight,0),gc=ss.reduce((a,s)=>a+s.cap_jo,0);
 rows+=`<tr class="grp"><td>${g} (${ss.length})</td><td>${fmt(gc,1)}</td><td></td><td>${fmt(gw)}%</td></tr>`;
 ss.forEach(s=>{
  const f=s.flu==null?'—':(s.flu>0?`<span class="flu-up">+${fmt(s.flu)}%</span>`:s.flu<0?`<span class="flu-dn">${fmt(s.flu)}%</span>`:'0.00%');
  rows+=`<tr><td class="name">${s.name}<span class="cd">${s.code}</span></td><td>${fmt(s.cap_jo,1)}</td><td>${f}</td>
  <td><span class="wbar" style="width:${Math.round(s.weight/maxW*70)}px"></span>${fmt(s.weight)}%</td></tr>`;});
});
rows+=`<tr class="total"><td>합계 (7종목)</td><td>${fmt(D.stocks.reduce((a,s)=>a+s.cap_jo,0),1)}</td><td></td><td>${fmt(D.basket_weight)}%</td></tr>`;
document.getElementById('tbl').innerHTML=`<table><thead><tr><th>종목</th><th>시가총액(조원)</th><th>등락률</th><th>KOSPI 대비 비중</th></tr></thead><tbody>${rows}</tbody></table>`;
</script></body></html>
